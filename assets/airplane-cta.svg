<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 140" width="280" height="140" fill="none">
  <!-- Dotted curved contrail from bottom-left to tail -->
  <path d="M 5,125 C 40,118 70,105 105,75" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>
  
  <!-- Line-art Jet Airplane matching screenshot -->
  <g transform="translate(100, 20) rotate(-22) scale(0.85)">
    <!-- Main Fuselage & Nose -->
    <path d="M 85,25 C 105,27 125,32 135,36 C 142,39 146,43 140,46 C 130,50 100,56 80,58 L 22,60 C 15,60 10,58 12,52 L 20,44 L 20,25 C 20,20 25,20 30,22 L 48,42 L 85,25 Z" 
          stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
    
    <!-- Wings (Swept-back large left wing) -->
    <path d="M 68,44 L 40,95 C 38,98 42,100 46,99 L 88,68 L 102,48" 
          stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
    
    <!-- Top Right Wing (perspective) -->
    <path d="M 92,34 L 115,2 C 117,-1 121,0 120,3 L 112,32" 
          stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
          
    <!-- Tail Fin (vertical stabilizer) -->
    <path d="M 16,46 L -6,14 C -8,11 -4,9 -1,11 L 22,38" 
          stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" fill="none"/>

    <!-- Horizontal Stabilizer -->
    <path d="M 12,56 L -4,68 C -6,70 -4,72 -1,71 L 20,60" 
          stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" fill="none"/>

    <!-- Jet Engine Under Wing -->
    <rect x="62" y="66" width="22" height="8" rx="4" transform="rotate(-15 62 66)" stroke="#ffffff" stroke-width="2" fill="none"/>
    
    <!-- Cockpit Windshield -->
    <path d="M 124,34 Q 130,37 132,41" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Cabin Windows line -->
    <line x1="60" y1="46" x2="115" y2="40" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="2 3" stroke-linecap="round"/>
  </g>
</svg>
