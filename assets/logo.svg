<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59334"/>
      <stop offset="25%" stop-color="#E8C374"/>
      <stop offset="50%" stop-color="#D4A340"/>
      <stop offset="75%" stop-color="#E1BC66"/>
      <stop offset="100%" stop-color="#A67822"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#8a5f14" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ornate Sunburst / Mandala Arch -->
  <g transform="translate(160, 32)" stroke="url(#goldGrad)" stroke-width="1.4" fill="none">
    <!-- Outer delicate arc -->
    <path d="M -90 12 A 92 48 0 0 1 90 12" stroke-dasharray="2 3"/>
    <!-- Main decorative arc -->
    <path d="M -80 14 A 82 42 0 0 1 80 14" stroke-width="1.8"/>
    <!-- Inner arc -->
    <path d="M -70 16 A 72 36 0 0 1 70 16"/>

    <!-- Radiant sun rays -->
    <line x1="0" y1="-44" x2="0" y2="-52" stroke-width="2"/>
    <line x1="-22" y1="-41" x2="-27" y2="-49"/>
    <line x1="22" y1="-41" x2="27" y2="-49"/>
    <line x1="-42" y1="-33" x2="-51" y2="-39"/>
    <line x1="42" y1="-33" x2="51" y2="-39"/>
    <line x1="-60" y1="-21" x2="-71" y2="-25"/>
    <line x1="60" y1="-21" x2="71" y2="-25"/>
    <line x1="-74" y1="-6" x2="-86" y2="-7"/>
    <line x1="74" y1="-6" x2="86" y2="-7"/>

    <!-- Small decorative dots along rays -->
    <circle cx="0" cy="-56" r="1.8" fill="url(#goldGrad)"/>
    <circle cx="-29" cy="-52" r="1.4" fill="url(#goldGrad)"/>
    <circle cx="29" cy="-52" r="1.4" fill="url(#goldGrad)"/>
    <circle cx="-54" cy="-42" r="1.3" fill="url(#goldGrad)"/>
    <circle cx="54" cy="-42" r="1.3" fill="url(#goldGrad)"/>
    <circle cx="-74" cy="-27" r="1.2" fill="url(#goldGrad)"/>
    <circle cx="74" cy="-27" r="1.2" fill="url(#goldGrad)"/>

    <!-- Center crest motif -->
    <path d="M 0 -36 C -8 -26, -14 -10, 0 4 C 14 -10, 8 -26, 0 -36 Z" fill="url(#goldGrad)" opacity="0.85"/>
  </g>

  <!-- Brand Title: Shiv Safar -->
  <text x="160" y="58" text-anchor="middle"
        font-family="'Playfair Display', 'Cinzel', Georgia, serif"
        font-size="34" font-weight="700" font-style="italic"
        fill="url(#goldGrad)" filter="url(#goldGlow)" letter-spacing="1">
    Shiv Safar
  </text>

  <!-- Tagline: HOLIDAYS -->
  <text x="160" y="78" text-anchor="middle"
        font-family="'Plus Jakarta Sans', 'Inter', sans-serif"
        font-size="10.5" font-weight="600"
        fill="url(#goldGrad)" letter-spacing="6">
    HOLIDAYS
  </text>

  <!-- Bottom micro ornament -->
  <g transform="translate(160, 86)" stroke="url(#goldGrad)" stroke-width="1" fill="none">
    <line x1="-40" y1="0" x2="-10" y2="0"/>
    <circle cx="0" cy="0" r="2.2" fill="url(#goldGrad)"/>
    <line x1="10" y1="0" x2="40" y2="0"/>
  </g>
</svg>
